[project]
name = "veridoc-ai"
version = "0.1.0"
description = "VeriDoc AI Document Intelligence Platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
]


[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
addopts = "--cov=apps --cov=services --cov=libs --cov=models --cov=training --cov-report=term-missing --cov-report=xml"
