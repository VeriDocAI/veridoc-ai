name: 🚀 Feature Request
description: Propose a new feature or enhancement for VeriDoc AI
title: "[Feature]: "
labels: ["type:feature"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting a feature! Please provide as much detail as possible to help us understand and plan the implementation.
  - type: textarea
    id: summary
    attributes:
      label: Feature Summary / User Story
      description: What is the proposed feature, and what problem does it solve?
      placeholder: As a user, I want to be able to... so that...
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution / Implementation Idea
      description: Describe the solution you'd like to see. How should it work?
      placeholder: We should implement an endpoint / service that...
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or workarounds you've considered.
      placeholder: E.g., instead of building a custom parser, we could integrate...
  - type: checkboxes
    id: areas
    attributes:
      label: Affected Areas
      description: Select all areas this feature touches.
      options:
        - label: Platform / Core Architecture
        - label: Data Pipelines / Ingestion
        - label: Machine Learning / Computer Vision Models
        - label: Backend Logic / APIs
        - label: Frontend UI / UX
        - label: Infrastructure / CI-CD / DevOps
  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Add any other context, designs, mockups, or screenshots here.
