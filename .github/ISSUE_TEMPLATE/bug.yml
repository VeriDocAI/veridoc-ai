name: 🐛 Bug Report
description: File a bug report to help us improve VeriDoc AI
title: "[Bug]: "
labels: ["type:bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please provide a clear and concise description of the bug.
  - type: textarea
    id: description
    attributes:
      label: Describe the Bug
      description: A clear and concise description of what the bug is.
      placeholder: E.g., The OCR pipeline fails when processing skewed PDF documents...
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Upload a skewed receipt PDF...
        2. Click 'Run OCR'...
        3. See the error 'IndexError: list index out of range' in the logs...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: A clear and concise description of what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: A clear and concise description of what actually happened.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment & Versions
      description: Version of python, OS, packages, or specific deployment environment where this was observed.
      placeholder: e.g. Python 3.13, Windows 11, PyTorch 2.4
  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Add any other context, logs, stack traces, or screenshots here.
